# Explicit project name so containers/network are prefixed "studymate-server-"
# instead of the generic "server-" Compose would otherwise derive from this
# folder's name — this machine hosts Postgres containers for multiple
# projects, so the generic name was ambiguous.
name: studymate-server
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: studymate
      POSTGRES_PASSWORD: studymate
      POSTGRES_DB: studymate_dev
    # Host port 5434 — 5432 clashes with a native Postgres install on this
    # machine, and 5433 is already used by an unrelated project's container.
    ports: ['5434:5432']
    volumes: ['pgdata:/var/lib/postgresql/data']
volumes:
  pgdata:
